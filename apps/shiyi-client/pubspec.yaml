name: cyberverse_app
description: 时忆数字生命 Android 前端 Demo，后端计划基于 CyberVerse。
publish_to: none
version: 1.3.1+5
environment:
  sdk: '>=3.12.0 <4.0.0'
dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  shared_preferences: ^2.5.3
  file_picker: ^10.3.10
  cryptography: ^2.7.0
  crypto: ^3.0.7
  url_launcher: ^6.3.2
  http: ^1.4.0
  web_socket_channel: ^3.0.3
  path_provider: ^2.1.5
  record: ^7.1.2
  audioplayers: ^6.8.1
  flutter_webrtc: ^1.6.2+hotfix.4
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
flutter:
  uses-material-design: true
  assets:
    - assets/branding/logo.png
    - assets/portraits/
  fonts:
    - family: NotoSansSC
      fonts:
        - asset: assets/fonts/NotoSansSC.ttf
